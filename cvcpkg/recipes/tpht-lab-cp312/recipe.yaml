schema_version: 1
recipe:
  name: tpht-lab-cp312
  upstream_version: "0.1.0"
  cvc_revision: 1
  maintainer: "CVC Lab"
  maintainer_url: "https://github.com/CVC-Lab/TPHT_dynamics_viz_panel"
  homepage: https://github.com/CVC-Lab/TPHT_dynamics_viz_panel
  license: "GPL-3.0-only"
  tags: [python, robotics, physics, mujoco]
  description: >-
    tpht-lab 0.1.0 for CPython 3.12, the native host of the TPHT dynamics viz panel: the
    `tpht-lab` command serves the site (share/tpht-viz-panel, from the tpht-viz-panel recipe)
    with the right MIME types, runs the page's binding self-tests natively with cvcpkg's MuJoCo
    (`tpht-lab check`), runs the in-browser test page headless (`tpht-lab test`, with
    playwright-chromium-headless-shell on linux x86_64), and exports the page's assets from the
    TPHT benchmark bundle (`tpht-lab export`). Built from this repository with the prefix's own
    CPython; nothing is downloaded.

# From the repository root, after `cvcpkg install python312 numpy-cp312 mujoco3-cp312
# setuptools-cp312 --prefix deps`:
#   cvcpkg build tpht-lab-cp312 --local --recipes-dir cvcpkg/recipes --prefix deps --build-prefix deps
# then run deps/bin/tpht-lab (deps\Scripts\tpht-lab.exe on Windows).

source:
  # This repository; `path` is counted from cvcpkg/recipes/_vendored/ (see tpht-viz-panel).
  type: vendored
  path: ../../..

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    # PEP-517 backend; --no-build-isolation means pip will not fetch it.
    - name: setuptools-cp312
  runtime:
    - name: python312
    - name: numpy-cp312
    # MuJoCo 3.17.0's bindings, the same release as the site (see cvcpkg/recipes/tpht-backend).
    - name: mujoco3-cp312
      version: "==3.17.0"
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    # Pure Python: one noarch build for the POSIX layout, and Windows for its own layout.
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/tpht_lab/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/tpht_lab-*.dist-info/", platforms: [any] }
    - { glob: "bin/tpht-lab", platforms: [any] }
    - { glob: "Lib/site-packages/tpht_lab/", platforms: [windows] }
    - { glob: "Lib/site-packages/tpht_lab-*.dist-info/", platforms: [windows] }
    - { glob: "Scripts/tpht-lab.exe", platforms: [windows] }
