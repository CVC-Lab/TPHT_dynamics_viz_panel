# Builds the static site from the repository's cvcpkg recipes, tests it, and publishes it to
# GitHub Pages. No node, npm or bundler: every third-party piece comes from cvcpkg.
#   - MuJoCo 4.0 (wasm32, static) and CPython 3.12 + numpy + MuJoCo's Python package: the
#     cvcpkg.org catalog.
#   - ONNX Runtime Web, the site and the tpht-lab host: cvcpkg/recipes/ in this repository.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Pull requests build and test; only main deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The cvcpkg CLI version, pinned. cvcpkg.org's installer checks the download against the
  # sha256 the registry recorded for it.
  CVCPKG_VERSION: "2.5.13"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PREFIX: ${{ github.workspace }}/../tpht-deps
    steps:
      - uses: actions/checkout@v4

      - name: Install the cvcpkg CLI
        # The README's step 1, pinned to one version.
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh \
            | sh -s -- --install-dir "$RUNNER_TEMP/bin" --version "$CVCPKG_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cvcpkg" --version

      - name: Install runtimes and tools from the cvcpkg catalog
        run: |
          set -euo pipefail
          cvcpkg install python312 numpy-cp312 mujoco-core-cp312 setuptools-cp312 \
            playwright-chromium-headless-shell --prefix "$PREFIX"
          cvcpkg install mujoco --platform wasm --arch wasm32 --link static --prefix "$PREFIX"

      - name: Build the repository's recipes
        run: |
          set -euo pipefail
          for r in onnxruntime-web tpht-viz-panel; do
            cvcpkg build "$r" --platform any --local --recipes-dir cvcpkg/recipes \
              --prefix "$PREFIX" --build-prefix "$PREFIX"
          done
          cvcpkg build tpht-lab-cp312 --local --recipes-dir cvcpkg/recipes \
            --prefix "$PREFIX" --build-prefix "$PREFIX"

      - name: Native MuJoCo checks on the site's assets
        run: '"$PREFIX/bin/tpht-lab" check'

      - name: Controller tests in headless Chromium
        # GitHub's ubuntu-24.04 image restricts unprivileged user namespaces, so Chromium
        # cannot start its sandbox there.
        run: '"$PREFIX/bin/tpht-lab" test --no-sandbox'

      - name: Report what will be published
        run: |
          du -sh "$PREFIX/share/tpht-viz-panel"
          find "$PREFIX/share/tpht-viz-panel/assets" -maxdepth 2 -type d | sort
          cat "$PREFIX/share/tpht-viz-panel/build-info.json"

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PREFIX }}/share/tpht-viz-panel

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
