# Builds the static site and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Requires package-lock.json in the repository (commit it after your first npm install).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci               # postinstall copies ONNX Runtime wasm into public/ort
      - run: npm test             # controller ports vs committed fixtures; no Python needed
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # '/<repo>/' for project sites; '/' for a custom domain or <user>.github.io repo.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Report what will be published
        run: |
          du -sh dist
          find dist/assets -maxdepth 3 -type d | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
