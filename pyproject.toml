[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpht-lab"
version = "0.1.0"
description = "Native host for the TPHT dynamics viz panel: serve the site, native MuJoCo checks, headless tests, asset export"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# MuJoCo 3.17.0, the release the site runs (cvcpkg's mujoco3-cp312 provides `import mujoco`).
dependencies = ["numpy", "mujoco==3.17.0"]

[project.optional-dependencies]
# Only for `tpht-lab export gait|ctrl-policy` (the benchmark bundle's own environment).
export = ["torch", "onnx", "onnxruntime", "gymnasium"]

[project.scripts]
tpht-lab = "tpht_lab.cli:main"

[tool.setuptools]
packages = ["tpht_lab"]
